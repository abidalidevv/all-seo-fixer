<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Test Browser Runner for admin.js</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
        window.asfData = {
            ajax: '/wp-admin/admin-ajax.php',
            nonce: '12345',
            adminUrl: '/wp-admin/',
            siteUrl: 'http://localhost',
            hasPsiKey: '0',
            lastAudit: null
        };
        window.errors = [];
        window.addEventListener('error', function(e) {
            window.errors.push(e.message + ' at line ' + e.lineno);
            console.error('WINDOW ERROR CAUGHT:', e.message, 'at', e.filename, 'line', e.lineno);
        });
    </script>
</head>
<body style="font-family:sans-serif;padding:30px;">
    <div id="test-output"><h1>Testing admin.js...</h1></div>

    <!-- Settings navigation tabs -->
    <nav class="nav-tab-wrapper wp-clearfix" id="asf-settings-tab-bar" style="margin-bottom:20px;">
        <a href="#tab-general" class="nav-tab asf-tab-nav nav-tab-active" data-tab="general">General</a>
        <a href="#tab-ai" class="nav-tab asf-tab-nav" data-tab="ai">AI</a>
        <a href="#tab-geo" class="nav-tab asf-tab-nav" data-tab="geo">GEO</a>
        <a href="#tab-crawlers" class="nav-tab asf-tab-nav" data-tab="crawlers">Crawlers</a>
    </nav>
    <div class="asf-tab-panel" data-panel="general" style="padding:15px;background:#f1f5f9;">General Panel</div>
    <div class="asf-tab-panel" data-panel="ai" style="display:none;padding:15px;background:#f1f5f9;">AI Panel</div>
    <div class="asf-tab-panel" data-panel="geo" style="display:none;padding:15px;background:#f1f5f9;">GEO Panel</div>
    <div class="asf-tab-panel" data-panel="crawlers" style="display:none;padding:15px;background:#f1f5f9;">Crawlers Panel</div>

    <!-- Geo Hub buttons -->
    <div style="margin-top:30px;">
        <button type="button" class="button button-primary" id="asf-geo-audit-btn">🔍 Run AI Readiness Audit</button>
        <div id="asf-geo-audit-status"></div>
        <div id="asf-geo-audit-results"></div>
    </div>

    <div style="margin-top:20px;">
        <form id="asf-geo-bots-form">
            <button type="button" class="button button-primary" id="asf-save-geo-bots-btn">💾 Save AI Crawler Directives</button>
            <span id="asf-geo-bots-msg"></span>
        </form>
    </div>

    <!-- Load the actual admin.js -->
    <script src="assets/js/admin.js"></script>

    <script>
        $(document).ready(function() {
            setTimeout(function() {
                var out = document.getElementById('test-output');
                var report = [];

                if (window.errors.length > 0) {
                    report.push('<div style="color:red;font-weight:bold;">❌ FATAL JS ERRORS: ' + window.errors.join('<br>') + '</div>');
                } else {
                    report.push('<div style="color:green;font-weight:bold;">✓ admin.js loaded with 0 window errors!</div>');
                }

                // 1. Test clicking setting tab AI
                $('.asf-tab-nav[data-tab="ai"]').trigger('click');
                var aiVisible = $('.asf-tab-panel[data-panel="ai"]').is(':visible');
                var genHidden = !$('.asf-tab-panel[data-panel="general"]').is(':visible');
                if (aiVisible && genHidden) {
                    report.push('<div style="color:green;">✓ Setting tab switch: PASSED (AI panel visible)</div>');
                } else {
                    report.push('<div style="color:red;">❌ Setting tab switch: FAILED (panel did not switch)</div>');
                }

                // 2. Test clicking Geo Audit button
                var geoBtn = document.getElementById('asf-geo-audit-btn');
                var origText = geoBtn.textContent;
                $(geoBtn).trigger('click');
                var geoSpinning = geoBtn.textContent.includes('Auditing') || geoBtn.disabled;
                report.push('<div style="color:' + (geoSpinning ? 'green' : 'red') + ';">' + (geoSpinning ? '✓' : '❌') + ' Geo Audit Click: ' + (geoSpinning ? 'PASSED (Button is spinning/active)' : 'FAILED (Button did not respond)') + '</div>');

                // 3. Test clicking Geo Save Bots button
                var botBtn = document.getElementById('asf-save-geo-bots-btn');
                $(botBtn).trigger('click');
                var botSaving = botBtn.textContent.includes('Saving') || botBtn.disabled;
                report.push('<div style="color:' + (botSaving ? 'green' : 'red') + ';">' + (botSaving ? '✓' : '❌') + ' Save Bots Click: ' + (botSaving ? 'PASSED (Button is saving/active)' : 'FAILED (Button did not respond)') + '</div>');

                out.innerHTML = report.join('');
            }, 50);
        });
    </script>
</body>
</html>
